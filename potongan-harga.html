<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promo Token Agustus 1080×1920 60 FPS</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f2;--fg:#17201b;--card:#fff;--line:#d8ddd9;--ac:#0b8f47;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1411;--fg:#eef3ef;--card:#19201c;--line:#2b342e}}
:root[data-theme="dark"]{--bg:#0f1411;--fg:#eef3ef;--card:#19201c;--line:#2b342e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;padding:16px;max-width:1120px;margin:auto}
@media(max-width:820px){.app{grid-template-columns:1fr}.panel{order:2}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:calc(100vh - 32px);overflow:auto}
@media(max-width:820px){.panel{max-height:none}}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px;opacity:.65}h2:first-child{margin-top:0}
label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
input[type=text],select{flex:1;min-width:0;width:100%;max-width:200px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit}
select{max-width:none;margin-bottom:4px}
input[type=color]{width:44px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
input[type=range]{flex:1;max-width:190px;accent-color:var(--ac)}
input[type=file]{max-width:200px;font-size:12px}
.frame{aspect-ratio:9/16;width:min(100%,calc(78vh*9/16));margin:auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:repeating-conic-gradient(#8884 0 25%,#fff4 0 50%) 0 0/24px 24px}
canvas{display:block;width:100%;height:100%;cursor:move}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:12px auto 0;width:min(100%,calc(78vh*9/16))}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:8px 12px;font:600 13px system-ui,sans-serif;cursor:pointer}
button.alt{background:transparent;color:inherit;border:1px solid var(--line)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#sl{flex:1 1 100%;accent-color:var(--ac)}
.sx{border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:6px 0}.sx .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}.sx .t span{flex:1}.sx .r{display:flex;gap:6px;align-items:center;margin-top:4px}.sx select{max-width:none;flex:1;margin:0;font-size:12px}.sx input[type=range]{max-width:80px;flex:none}.sx button{padding:4px 8px;font-size:12px}.sx .fn{font-size:11px;opacity:.7;margin-top:2px;word-break:break-all}
.lock,.hint{font-size:12px;opacity:.75;text-align:center;width:100%}.hint{text-align:left;margin:4px 0}
</style>
</head>
<body>
<div class="app">
<section class="stage">
<div class="frame"><canvas id="cv" width="1080" height="1920"></canvas></div>
<div class="bar">
<input id="sl" type="range" min="0" max="15" step="0.001" value="0" aria-label="Linimasa">
<button class="alt" id="un">↶ Undo</button><button class="alt" id="re">↷ Redo</button><button id="pb">Jeda</button><button class="alt" id="rs">Ulang</button>
<button id="rc">Rekam video</button><button class="alt" id="pn">Simpan PNG</button>
<div class="lock">🔒 Terkunci 1080×1920 (9:16) · 60 FPS · seret di kanvas untuk memindah elemen terpilih</div>
</div>
</section>
<aside class="panel" id="pn2"></aside>
</div>

size:100,strk:11,spd:100,vol:80,anim:true,loop:true,shine:true,burst:true,transp:false,shadow:true,shk:100};

['Teks elemen',[['t1','Badge baris 1','text'],['t2','Badge baris 2','text'],['t3','Badge baris 3','text'],['pill','Teks pill','text'],['logo1','Logo teks 1','text'],['logo2','Logo teks 2','text'],['snk','Teks kecil bawah','text']]],
['Warna',[['cText','Teks putih','color'],['cPrice','Harga baru','color'],['cStrike','Coretan','color'],['cBadge','Badge Rp','color'],['cBg1','Latar atas','color'],['cBg2','Latar bawah','color'],['cR1','Cincin 1','color'],['cR2','Cincin 2','color']]],
['Ukuran dan gerak',[['size','Ukuran harga baru %','range',60,140],['strk','Tebal coretan','range',6,24],['spd','Kecepatan %','range',50,200],['shk','Kekuatan bayangan %','range',0,200]]],
['Opsi',[['anim','Gerak otomatis (zoom & melayang)','checkbox'],['loop','Ulangi terus','checkbox'],['shine','Efek kilau','checkbox'],['burst','Konfeti ledakan (produk & harga baru)','checkbox'],['transp','Latar transparan','checkbox'],['shadow','Bayangan produk & gambar','checkbox']]]];

[['zoom','Zoom bergantian (sesuai video)','checkbox'],['za','Kekuatan zoom %','range',0,30,1],['zs','Kecepatan zoom (Hz, elemen tanpa pola video)','range',.1,3,.1],['fl','Melayang','checkbox'],['fa','Jarak melayang px','range',0,60,1],['fs','Kecepatan melayang (Hz)','range',.1,2,.1]].forEach(([k,lb,ty,mn,mx,st])=>{

i.oninput=()=>{const e=E[sk];if(e)e[k]=ty==='checkbox'?i.checked:+i.value};i.onchange=commit;l.append(sp,i);P2.appendChild(l);R[k]=i});
const fi=cb=>{const i=mk('input');i.type='file';i.accept='image/*';i.style.display='none';i.onchange=()=>{const f=i.files[0];if(f)ld(f,im=>{cb(im);i.value=''})};P2.appendChild(i);return i};
const replaceSel=im=>{if(E[sk]){E[sk].img=im;E[sk].on=true;fillUI();commit()}};
const upI=fi(replaceSel);
const addI=fi(im=>{const k='c'+(++cn);E[k]={n:'Gambar '+cn,x:360,y:640,s:100,r:0,on:true,b:300,img:im,x0:360,y0:640,r0:0,ix:0,iy:0,custom:true,...ANd,ph:cn*1.3,a0:{...ANd}};sk=k;opts();fillUI();commit()});
const trash={};
const rw=mk('div','','row');
rw.append(btn('Ganti gambar',()=>E[sk]&&upI.click(),''),btn('Tambah gambar baru',()=>addI.click(),''),
btn('Reset elemen',()=>{const e=E[sk];if(!e)return;Object.assign(e,{x:e.x0,y:e.y0,s:100,r:e.r0,on:true,...e.a0});if(!e.custom)e.img=null;fillUI();commit()}),
btn('Hapus elemen',()=>{if(!E[sk])return;trash[sk]=E[sk];delete E[sk];sk=Object.keys(E)[0]||'';opts();fillUI();commit()}),
btn('Pulihkan terhapus',()=>{Object.assign(E,trash);Object.keys(trash).forEach(k=>delete trash[k]);if(!E[sk])sk=Object.keys(E)[0]||'';opts();fillUI();commit()}));

addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const tg2=e.target.tagName;if(tg2==='INPUT'&&e.target.type==='text')return;
const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}});

// ===== simpan otomatis + buka otomatis proyek terakhir =====
const KEY='promo-editor-state-v1';
const ser=o=>Object.entries(o).map(([k,e])=>[k,{...e,img:e.img?e.img.src:null}]);
function stateObj(){return{v:1,cfg:{...cfg},E:ser(E),T:ser(trash),cn,sk,
sl:SL.map(s=>({id:s.id,on:s.on,p:s.p,vol:s.vol,cust:s.cust,fn:s.fn,du:s.du||null})),
bg:{snd,vol:bgVol,du:bgCustom},sfx:{on:sfxOn,vol:sfxVol}}}
const sg2=()=>sg()+JSON.stringify([SL.map(s=>[s.on,s.p,s.vol,s.cust,s.fn]),snd,sfxOn,bgVol,sfxVol,bgCustom?bgCustom.length:0,sk]);
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('promo-editor',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function dbGet(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbSet(v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,KEY);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbDel(){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(KEY);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function b64ab(du){const bin=atob(du.split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
let lastSig='',chg=0,saved='',ready=false,busy=false;
async function persist(){
const sig=sg2(),st=stateObj();
try{await dbSet(st)}catch(e){
try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e2){saved=sig;msg('Simpan otomatis tidak tersedia di mode ini. Buka file langsung di browser.');return false}}
saved=sig;msg('Tersimpan otomatis '+new Date().toLocaleTimeString('id-ID'));return true}
async function resetAll(){ready=false;try{await dbDel()}catch(e){}try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
async function applyState(s){
const cache={},LI=src=>cache[src]||(cache[src]=new Promise(res=>{const im=new Image();im.onload=()=>{im._id=++iid;res(im)};im.onerror=()=>res(null);im.src=src}));
const rest=async arr=>{const o=[];for(const [k,e] of arr){const n={...e};n.img=e.img?await LI(e.img):null;o.push([k,n])}return o};
const E2=await rest(s.E||[]),T2=await rest(s.T||[]);
Object.assign(cfg,s.cfg||{});
Object.keys(E).forEach(k=>delete E[k]);E2.forEach(([k,e])=>E[k]=e);
Object.keys(trash).forEach(k=>delete trash[k]);T2.forEach(([k,e])=>trash[k]=e);
cn=s.cn||0;sk=E[s.sk]?s.sk:(Object.keys(E)[0]||'');
Object.keys(INP).forEach(k=>{const i=INP[k];if(i.type==='checkbox')i.checked=cfg[k];else i.value=cfg[k]});
for(const o of (s.sl||[])){const q=SL.find(z=>z.id===o.id);if(!q)continue;
Object.assign(q,{on:o.on,p:PS[o.p]?o.p:q.p,vol:o.vol,cust:!!(o.cust&&o.du),fn:o.fn||'',du:o.du||null});q.buf=null;
if(q.du){try{if(initAudio())q.buf=await ac.decodeAudioData(b64ab(q.du));else q.cust=false}catch(e){q.cust=false;q.du=null;q.fn=''}}
q.ui()}
if(s.bg){snd=s.bg.snd!==false;sb.textContent=snd?'🔊 Backsound nyala':'🔇 Backsound mati';
const bv=typeof s.bg.vol==='number'?s.bg.vol:.8;setBgVol(bv);vi.value=bv*100;
if(s.bg.du){au.src=s.bg.du;bgCustom=s.bg.du;am.textContent='Backsound kustom dipulihkan.'}}
if(s.sfx){sfxOn=s.sfx.on!==false;xb.textContent=sfxOn?'🔊 SFX nyala':'🔇 SFX mati';
sfxVol=typeof s.sfx.vol==='number'?s.sfx.vol:1;xi.value=sfxVol*100;if(sfxBus)sfxBus.gain.value=sfxVol}
opts();fillUI();HS=[];hi=-1;commit();lastSig=sg2()}
setInterval(()=>{if(!ready)return;const s2=sg2();
if(s2!==lastSig){lastSig=s2;chg=performance.now();return}
if(s2!==saved&&performance.now()-chg>700&&!busy){busy=true;persist().finally(()=>{busy=false})}},400);
const flush=()=>{if(ready&&!busy&&sg2()!==saved)persist()};
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

sec('Simpan & pindah browser');
P2.appendChild(mk('div','Perubahan tersimpan otomatis di browser ini dan proyek terakhir langsung terbuka saat halaman dibuka lagi. Untuk membuka di browser atau perangkat lain, unduh proyek lalu buka di sana.','hint'));
const pj=mk('input');pj.type='file';pj.accept='application/json,.json';pj.style.display='none';
pj.onchange=async()=>{const f=pj.files[0];pj.value='';if(!f)return;
try{const s=JSON.parse(await f.text());if(!s||s.v!==1)throw new Error('format tidak dikenal');await applyState(s);await persist();msg('Proyek dibuka: '+f.name)}
catch(e){msg('Gagal membuka proyek: '+e.message)}};
P2.appendChild(pj);
const pr=mk('div','','row');
pr.append(btn('⬇ Unduh proyek',()=>dl(new Blob([JSON.stringify(stateObj())],{type:'application/json'}),'proyek-promo.json'),''),
btn('⬆ Buka proyek',()=>pj.click()),btn('Hapus simpanan & reset',resetAll));
P2.appendChild(pr);
commit();
fillUI();requestAnimationFrame(tick);
(async()=>{let s=null;
try{s=await dbGet()}catch(e){}
if(!s){try{const r=localStorage.getItem(KEY);if(r)s=JSON.parse(r)}catch(e){}}
if(s&&s.v===1){try{await applyState(s);msg('Proyek terakhir dibuka otomatis.')}catch(e){msg('Gagal membuka simpanan: '+e.message)}}
lastSig=sg2();saved=lastSig;ready=true})();
</script>
</body>
</html>
