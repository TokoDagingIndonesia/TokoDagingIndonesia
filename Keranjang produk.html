<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor Animasi Produk</title>
<style>
:root{--bg:#f4f6f3;--pn:#fff;--tx:#1b2a1f;--mu:#6b7a6f;--ac:#1f9d3a;--bd:#d9e0da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121813;--pn:#1b231d;--tx:#e8efe9;--mu:#93a398;--bd:#2c382f}}
:root[data-theme="dark"]{--bg:#121813;--pn:#1b231d;--tx:#e8efe9;--mu:#93a398;--bd:#2c382f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 'Fredoka',system-ui,sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:12px;min-height:100vh}
@media(max-width:800px){.app{grid-template-columns:1fr}}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px}
h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
button,input,select{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:hover{filter:brightness(.95)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.layers button{display:block;width:100%;text-align:left;margin-bottom:4px}
.layers button.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
label.f{display:grid;grid-template-columns:78px 1fr 44px;gap:6px;align-items:center;margin-bottom:4px;font-size:13px}
label.t{display:block;margin-bottom:6px;font-size:13px}
input[type=text],textarea,input[type=number]{width:100%;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg)}
input[type=color]{width:44px;height:28px;border:none;background:none;padding:0}
input[type=range]{width:100%}
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
#wrap{flex:1;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;min-height:400px}
#stage{position:relative;overflow:hidden;transform-origin:top left;flex:none;box-shadow:0 8px 30px #0003}
#scaler{position:relative}
.ly{position:absolute;cursor:grab;user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center}
.ly.sel{outline:2px dashed #fff8;outline-offset:6px}
.ly img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.pd{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:8% 6%;gap:6%;box-shadow:inset -10px 0 18px #0002,0 10px 20px #0003;font-weight:700;text-align:center;overflow:hidden}
.pd .br{font-size:15px;color:#fff;letter-spacing:.02em}
.pd .ti{color:#fff;padding:6px 8px;border-radius:6px;font-size:20px;line-height:1.05;white-space:pre-line;width:92%}
.pd .sb{color:#2a3;font-size:11px;background:#fff;border-radius:99px;padding:2px 8px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;z-index:99}
#start button{font-size:20px;padding:12px 24px}
.hint{color:var(--mu);font-size:12px}
</style></head><body>
<div class="app">
<aside class="pn">
 <h3>Kanvas</h3>
 <div class="row"><select id="preset"><option value="736x920">4:5 Poster</option><option value="1080x1920">9:16 Story</option><option value="1080x1080">1:1 Square</option><option value="1920x1080">16:9 Wide</option></select></div>
 <div class="row">W<input type="number" id="sw" value="736" style="width:70px"> H<input type="number" id="sh" value="920" style="width:70px"> <input type="color" id="bg1" value="#5f9e72" title="gradasi 1"><input type="color" id="bg2" value="#86bb8e" title="gradasi 2"><input type="color" id="bg3" value="#a6d0a8" title="gradasi 3"><input type="color" id="bg4" value="#cfe8cd" title="gradasi 4"><span class="hint">4 warna gradasi</span></div><div class="row"><select id="bgmode"><option value="grad">Latar: Gradasi</option><option value="img">Latar: Gambar</option></select><input type="file" accept="image/*" id="bgf" style="width:150px"><select id="bgfit"><option value="cover">Cover (penuh)</option><option value="contain">Contain (muat)</option><option value="100% 100%">Regangkan</option><option value="auto">Ukuran asli</option></select><button id="bgx">✕ Hapus gambar BG</button><select id="bgp"><option value="none">Pola: Tanpa</option><option value="spiral" selected>Pola: Pusaran</option><option value="rays">Pola: Sinar</option><option value="dots">Pola: Titik</option><option value="waves">Pola: Gelombang</option></select><input type="color" id="bgp2" value="#ffa726" title="warna pola"></div>
 <h3>Sound Effect</h3><div id="snd"></div>
 <h3>Layer</h3>
 <div class="layers" id="list"></div>
 <div class="row"><button onclick="addL('prod')">+ Produk</button><button onclick="addL('text')">+ Teks</button><button onclick="addL('price')">+ Diskon</button><button onclick="addL('deco')">+ Gambar/Dekor</button><button id="addpng">+ PNG (bisa banyak)</button><input type="file" id="pngin" accept="image/*" multiple style="display:none"></div>
 <div id="ctl"></div>
</aside>
<main class="main">
 <div class="pn row" style="margin:0">
  <button id="un" title="Undo (Ctrl+Z)">↶ Undo</button><button id="re" title="Redo (Ctrl+Y)">↷ Redo</button><button class="pri" id="pp">⏸ Jeda</button><button id="rs">↺ Ulang intro</button>
  <label>🔊 <input type="range" id="vol" min="0" max="1" step=".05" value=".6" style="width:90px"></label>
  <label>Zoom <input type="range" id="zm" min="0" max=".2" step=".01" value=".05" style="width:80px"></label>
  <label>Kecepatan <input type="range" id="spd" min=".3" max="2.5" step=".1" value="1" style="width:80px"></label>
  <label>Durasi <input type="number" id="dur" value="15" min="3" max="60" style="width:52px">dtk</label><label><input type="checkbox" id="fxs" checked> ✨ Kilau</label><label><input type="checkbox" id="fxc" checked> 🎉 Confetti</label><label><input type="checkbox" id="bgm" checked> 🌊 BG gerak</label><label><input type="checkbox" id="bgl"> 💡 Cahaya/bokeh</label><select id="intro"><option value="">Transisi awal: per layer</option><option value="drop">Semua: Jatuh</option><option value="left">Semua: Dari kiri</option><option value="right">Semua: Dari kanan</option><option value="up">Semua: Dari bawah</option><option value="pop">Semua: Pop</option><option value="spin">Semua: Putar</option><option value="fade">Semua: Fade</option><option value="basket">Produk: Keluar dari keranjang</option></select><label>Zoom elemen <input type="range" id="zg" min="0" max=".3" step=".01" value=".06" style="width:70px"></label><label>Bergantian <input type="range" id="zo" min="0" max=".5" step=".01" value=".25" style="width:70px"></label><label>Halus <input type="range" id="zk" min="0" max="1" step=".05" value=".6" style="width:70px"></label><label>Siklus <input type="range" id="zn" min="1" max="8" step="1" value="3" style="width:60px"></label><span id="tm" class="hint">0.0 / 15</span><span id="sv" class="hint"></span><select id="xs"><option value="1">JPEG 1x</option><option value="2" selected>JPEG 2x</option><option value="3">JPEG 3x (maks)</option></select><button id="jpg">⬇ JPEG kualitas terbaik</button><button id="rstp">🗑 Reset proyek</button><button id="rec">⏺ Rekam video</button>
 </div>
 <div style="height:4px;background:var(--bd);border-radius:2px"><div id="bar" style="height:4px;background:var(--ac);width:0;border-radius:2px"></div></div><div id="wrap"><div id="scaler"><div id="stage"><canvas id="fx" style="position:absolute;inset:0;pointer-events:none;z-index:50"></canvas><canvas id="bgc" style="position:absolute;inset:0;pointer-events:none;z-index:-100"></canvas><div id="start"><button class="pri">▶ Mulai + Suara</button></div></div></div></div>
 <div class="hint">Seret elemen di kanvas untuk memindahkan. Rekam: pilih tab ini saat diminta browser, lalu hentikan untuk mengunduh .webm.</div>
</main></div>
<script>
const $=id=>document.getElementById(id);
const P=(n,x,y,w,h,c,c2,b,t,s,r)=>({name:n,type:'prod',x,y,w,h,s:1,r,c,c2,t1:b,t2:t,t3:s,fl:12,vis:1,in:'basket',img:''});
let L=[
 P('Produk 2 (tablet)',62,31,150,190,'#6cc04a','#1c8a4a','natvia','SUGAR\nFIX\'D','200 tablets',6),
 P('Produk 1 (hot choc)',47,43,150,200,'#2f9d5a','#1d8a6b','natvia+','HOT CHOC\nRELAX','96% sugar free',-8),
 P('Produk 3 (value pack)',80,46,150,210,'#8bc34a','#1d3f9f','natvia','100% NATURAL\nSWEETENER','VALUE PACK',8),
 P('Produk 4 (box)',61,59,150,150,'#a5d36b','#1d3f9f','natvia+','100% NATURAL\nSWEETENER','40 sticks',-3),
 {name:'Keranjang',type:'basket',x:71,y:78,w:420,h:300,s:1,r:-6,c:'#1f9d3a',c2:'#ffffff',t1:'woolworths',fl:8,vis:1,img:''},
 {name:'Judul',type:'text',x:27,y:17,w:0,h:0,s:1,r:0,c:'#f6f7e0',t1:'FOR LIVING\nWELL, YOUR\nWAY.',size:64,fl:10,vis:1},
 {name:'Caption',type:'text',x:30,y:94,w:0,h:0,s:1,r:0,c:'#0a7a35',t1:'Shop Natvia ranges at Woolworths',size:16,fl:4,vis:1},
 Object.assign(newPrice(),{x:26,y:74,s:.85}),
 Object.assign(newDeco(),{x:10,y:58,w:56,h:56,shape:'spark',name:'Dekor 1'}),Object.assign(newDeco(),{x:90,y:22,w:70,h:70,shape:'bolt',sp:0,fl:10,name:'Dekor 2'}),Object.assign(newDeco(),{x:44,y:8,w:42,h:42,shape:'star',sp:-1,name:'Dekor 3'})
];
let sel=1,playing=1,t0=performance.now(),tAcc=0,last=performance.now(),played={},AC,mg;
const st=$('stage');
function build(c){L.forEach((l,i)=>{if(l.z==null)l.z=i;if(l.sh==null)l.sh=l.type==='text'?.25:.5;if(l.zm==null)l.zm=l.type==='text'?.08:0;if(l.zc==null)l.zc=2;if(l.type==='basket'){if(l.lgx==null)l.lgx=.42;if(l.lgy==null)l.lgy=.68;if(l.lgs==null)l.lgs=1}});
 [...st.querySelectorAll('.ly')].forEach(e=>e.remove());
 L.forEach((l,i)=>{const d=document.createElement('div');d.className='ly';d.dataset.i=i;
  if(l.type==='text'){d.style.cssText+=`font-weight:700;white-space:pre;text-align:left;line-height:1.05;`;}
  st.insertBefore(d,$('fx'));paint(i)});
 list();ctl();size();if(c!==0)commit();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function basket3d(l){const w=l.w,h=l.h,c=l.c,q=a=>a.map(p=>(p[0]*w).toFixed(1)+','+(p[1]*h).toFixed(1)).join(' '),lp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],F=[[.04,.36],[.82,.36],[.76,.98],[.10,.98]],S=[[.82,.36],[.98,.22],[.93,.80],[.76,.98]],T=[[.04,.36],[.20,.22],[.98,.22],[.82,.36]];
 const pg=(a,f,o)=>`<polygon points="${q(a)}" fill="${f}" ${o||''}/>`,ln=(a,b,sw,col)=>`<line x1="${a[0]*w}" y1="${a[1]*h}" x2="${b[0]*w}" y2="${b[1]*h}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;
 let s=`<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible"><ellipse cx="${w*.5}" cy="${h*1.03}" rx="${w*.4}" ry="${h*.05}" fill="#0004"/><path d="M${w*.14} ${h*.28}C${w*.12} ${-h*.1} ${w*.86} ${-h*.14} ${w*.96} ${h*.24}" fill="none" stroke="#151515" stroke-width="${h*.05}" stroke-linecap="round"/>`;
 s+=pg(T,c)+pg(T,'#000','opacity=".5"');
 s+=pg(S,c)+pg(S,'#000','opacity=".28"');
 for(let u=1;u<4;u++){const a=lp(S[0],S[1],u/4),b=lp(S[3],S[2],u/4);s+=ln(lp(a,b,.14),lp(a,b,.92),w*.02,'rgba(0,0,0,.32)')}
 s+=pg(F,c)+pg([[.04,.36],[.82,.36],[.78,.7],[.07,.7]],'#fff','opacity=".07"');
 for(let u=1;u<10;u++){const a=lp(F[0],F[1],u/10),b=lp(F[3],F[2],u/10);s+=ln(lp(a,b,.2),lp(a,b,.92),w*.022,'rgba(0,0,0,.3)')}
 s+=pg([[.2,.5],[.64,.5],[.62,.86],[.19,.86]],c)+pg([[.2,.5],[.64,.5],[.62,.86],[.19,.86]],'#fff','opacity=".1"');
 s+=pg([[.04,.36],[.82,.36],[.825,.42],[.043,.42]],'#fff','opacity=".3"')+pg([[.82,.36],[.98,.22],[.985,.27],[.825,.42]],'#fff','opacity=".18"')+ln(T[0],T[1],w*.012,'rgba(255,255,255,.35)')+ln(T[1],T[2],w*.012,'rgba(255,255,255,.35)');
 s+=`<g fill="none" stroke="${l.c2}" stroke-width="${w*.012}"><circle cx="${w*.36}" cy="${h*.60}" r="${w*.03}"/><circle cx="${w*.42}" cy="${h*.60}" r="${w*.03}"/></g><text x="${w*.41}" y="${h*.80}" text-anchor="middle" fill="${l.c2}" font-family="Fredoka,sans-serif" font-weight="600" font-size="${w*.06}">${esc(l.t1)}</text></svg>`;return s}
function paint(i){const l=L[i],d=st.children[i];if(!d)return;
 d.style.color=l.c;d.style.zIndex=l.z;d.style.filter=(l.sh>0&&l.type!=='basket')?`drop-shadow(${(l.sh*14).toFixed(1)}px ${(l.sh*22).toFixed(1)}px ${(l.sh*18).toFixed(1)}px rgba(0,0,0,${(.15+l.sh*.4).toFixed(2)}))`:'none';d.style.display=l.vis?'flex':'none';d.classList.toggle('sel',i===sel);
 if(l.type==='text'){d.style.fontSize=l.size+'px';d.textContent=l.t1;d.style.backgroundImage=`linear-gradient(105deg,${l.c} 0%,${l.c} 35%,rgba(255,255,255,.5) 44%,#fff 50%,rgba(255,255,255,.5) 56%,${l.c} 65%,${l.c} 100%)`;d.style.backgroundSize='300% 100%';d.style.backgroundPosition='100% 0';d.style.webkitBackgroundClip=d.style.backgroundClip='text';d.style.webkitTextFillColor='transparent';d.style.width=d.style.height='';return}
 d.style.width=l.w+'px';d.style.height=l.h+'px';
 if(l.img){const sh='<div class="shn" style="position:absolute;inset:0;overflow:hidden;pointer-events:none;-webkit-mask:url('+l.img+') center/contain no-repeat;mask:url('+l.img+') center/contain no-repeat"><i style="position:absolute;top:-20%;bottom:-20%;left:0;width:35%;opacity:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent)"></i></div>';d.innerHTML='<img src="'+l.img+'">'+sh;return}
 if(l.type==='deco'){d.innerHTML=decoSVG(l);return}
 if(l.type==='price'){d.innerHTML=priceHTML(l);return}
 if(l.type==='basket'){bkPaint(d,l);return}
 if(false){const w=l.w,h=l.h;let bars='';for(let k=1;k<14;k++)bars+=`<rect x="${k*w/14-5}" y="${h*.28}" width="10" height="${h*.5}" rx="4" fill="#0003"/>`;
  d.innerHTML=`<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}"><path d="M0 ${h*.22}H${w}L${w*.9} ${h*.92}Q${w*.88} ${h}${w*.8} ${h}H${w*.2}Q${w*.12} ${h}${w*.1} ${h*.92}Z" fill="${l.c}"/>${bars}<rect x="0" y="${h*.16}" width="${w}" height="${h*.1}" rx="${h*.05}" fill="${l.c}" stroke="#0003"/><text x="${w/2}" y="${h*.62}" text-anchor="middle" fill="${l.c2}" font-family="Fredoka,sans-serif" font-weight="600" font-size="${w*.075}">${esc(l.t1)}</text></svg>`;return}
 const rad=l.type==='prod'?'16px 16px 22px 22px':'8px';
 d.innerHTML=`<div class="pd" style="background:linear-gradient(#fff 0 0) bottom/100% 45% no-repeat,${l.c};border-radius:${rad}"><div class="br">${esc(l.t1)}</div><div class="ti" style="background:${l.c2};font-size:${Math.max(10,l.w*.12)}px">${esc(l.t2)}</div><div class="sb">${esc(l.t3)}</div></div><div class="shn" style="position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:${rad}"><i style="position:absolute;top:-20%;bottom:-20%;left:0;width:35%;opacity:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent)"></i></div>`;
}
function list(){$('list').innerHTML='';L.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l.name;b.className=i===sel?'on':'';b.onclick=()=>{sel=i;list();ctl();L.forEach((_,k)=>paint(k))};$('list').appendChild(b)})}
function sl(k,lbl,min,max,step){const l=L[sel];return `<label class="f">${lbl}<input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${l[k]}"><span>${(+l[k]).toFixed(step<1?2:0)}</span></label>`}
function ctl(){const l=L[sel];if(!l){$('ctl').innerHTML='';return}
 let h=`<h3>${esc(l.name)}</h3><label class="t">Nama<input type="text" data-k="name" value="${esc(l.name)}"></label>`+sl('x','Posisi X',-10,110,.5)+sl('y','Posisi Y',-10,110,.5)+sl('s','Skala',.2,3,.05)+sl('r','Rotasi',-45,45,1);
 if(l.type!=='text')h+=sl('w','Lebar',40,1200,5)+sl('h','Tinggi',40,1200,5);else h+=sl('size','Ukuran font',10,200,1);
 h+=sl('fl','Melayang',0,40,1)+sl('z','Depan/Blkg',-5,40,1)+sl('sh','Shadow',0,1,.05);
 h+=`<label class="t">Transisi awal <select data-k="in">${[['drop','Jatuh'],['left','Dari kiri'],['right','Dari kanan'],['up','Dari bawah'],['pop','Pop'],['spin','Putar'],['fade','Fade'],['basket','Dari keranjang']].map(o=>`<option value="${o[0]}"${(l.in||'drop')===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label>`;
 h+=`<div class="row">Warna <input type="color" data-k="c" value="${l.c}">`+(l.c2?`<input type="color" data-k="c2" value="${l.c2}">`:'')+(l.c3?`<input type="color" data-k="c3" value="${l.c3}">`:'')+`</div>`;
 h+=`<label class="t">${l.type==='prod'?'Merek':'Teks'}<textarea data-k="t1" rows="${l.type==='text'?3:1}" style="width:100%">${esc(l.t1)}</textarea></label>`;
 if(l.type==='prod')h+=`<label class="t">Judul<textarea data-k="t2" rows="2" style="width:100%">${esc(l.t2)}</textarea></label><label class="t">Label kecil<input type="text" data-k="t3" value="${esc(l.t3)}"></label>`;
 if(l.type==='basket')h+=`<label class="t">Gambar/logo di keranjang (PNG)<input type="file" accept="image/*" id="lgf"></label>`+sl('lgx','Logo X',0,1,.01)+sl('lgy','Logo Y',0,1,.01)+sl('lgs','Logo skala',.2,3,.05)+`<div class="row"><button id="lgd">Hapus logo</button></div>`;
 if(l.type==='deco')h+=`<label class="t">Bentuk (jika tanpa gambar) <select data-k="shape">${[['star','Bintang'],['spark','Kilau'],['bolt','Petir'],['heart','Hati'],['leaf','Daun'],['circle','Lingkaran']].map(o=>`<option value="${o[0]}"${l.shape===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label>`+sl('sp','Putar (kali/video)',-4,4,1);
 if(l.type==='price')h+=`<label class="t">Harga promo<input type="text" data-k="t2" value="${esc(l.t2)}"></label><label class="t">Label depan<input type="text" data-k="t3" value="${esc(l.t3)}"></label><label class="t">Satuan<input type="text" data-k="t4" value="${esc(l.t4)}"></label><label class="t">Badge<input type="text" data-k="t5" value="${esc(l.t5)}"></label>`+sl('ps','Mulai (detik)',0,12,.1);
 if(l.type!=='text'&&l.type!=='price')h+=`<label class="t">Ganti gambar (PNG transparan)<input type="file" accept="image/*" id="fi"></label>`;
 h+=`<div class="row"><label><input type="checkbox" id="vi" ${l.vis?'checked':''}> Tampil</label><button id="dup">Duplikat</button><button id="del">Hapus</button><button id="up">▲ Ke depan</button><button id="dn">▼ Ke belakang</button></div>`;
 $('ctl').innerHTML=h;
 $('ctl').querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{const k=e.dataset.k;l[k]=e.type==='range'?+e.value:e.value;if(e.type==='range')e.nextElementSibling.textContent=(+e.value).toFixed(e.step<1?2:0);paint(sel);if(k==='name')list()});$('ctl').querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{if(e.dataset.k==='in')reset();commit()});
 $('vi').onchange=e=>{l.vis=e.target.checked?1:0;paint(sel);commit()};
 const lgf=$('lgf');if(lgf){lgf.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{l.lg=r.result;paint(sel);commit()};r.readAsDataURL(f)};$('lgd').onclick=()=>{l.lg='';paint(sel);commit()}}
 const fi=$('fi');if(fi)fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{l.img=r.result;paint(sel);commit()};r.readAsDataURL(f)};
 $('dup').onclick=()=>{L.splice(sel+1,0,{...l,name:l.name+' copy',x:l.x+4,y:l.y+4});sel++;build()};
 $('del').onclick=()=>{L.splice(sel,1);sel=Math.max(0,sel-1);build()};
